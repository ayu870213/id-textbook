<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="CrCl·eGFR 기반 항생제 권장 용량과 질환별 가이드">
<title>감염내과 참고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f4f5; --surface:#ffffff; --sunk:#f7f9fa; --ink:#18242c; --ink2:#3d4b54; --muted:#6a7780; --line:#dbe1e4; --line2:#e8ecee;
  --accent:#1f5a45; --accent-ink:#ffffff; --accent-soft:#e2ece8; --accent-line:#a8c6ba;
  --warn:#9a5b00; --warn-soft:#fdf2df; --warn-line:#ebc98f;
  --alert:#b3372f; --grey-text:#8b969d; --th:#eef2f3;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --shadow:0 10px 30px rgba(16,32,40,.16);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0f1417; --surface:#161d21; --sunk:#12181b; --ink:#e3e9ec; --ink2:#bcc7cd; --muted:#8c9aa2; --line:#2a353b; --line2:#222b30;
    --accent:#62b395; --accent-ink:#0f1417; --accent-soft:#15302a; --accent-line:#2b5a4b;
    --warn:#e6b05c; --warn-soft:#2e2414; --warn-line:#5a4520;
    --alert:#ec7a70; --grey-text:#6f7d85; --th:#1d262b; --shadow:0 10px 30px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

/* top: brand + patient bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--line2)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;padding-block:8px}
.brand{display:flex;flex-direction:column;justify-content:flex-end;margin-right:6px;min-width:120px}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand span{font-size:11px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:2px}
.f>span{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.box{display:flex;align-items:stretch;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);overflow:hidden}
.box:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.box input{width:52px;border:0;background:transparent;padding:0 6px;font:500 13px var(--sans);outline:none}
.box select{border:0;background:transparent;padding:0 4px;outline:none}
.box em{font-style:normal;display:flex;align-items:center;padding:0 6px;font-size:11px;color:var(--muted);border-left:1px solid var(--line)}
.seg{display:flex;height:30px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;padding:0 10px;cursor:pointer;background:var(--sunk);color:var(--muted)}
.seg label+input+label{border-left:1px solid var(--line)}
.seg input:checked+label{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:-2px}
.renal{margin-left:auto;display:flex;align-items:flex-end;gap:14px}
.kv{display:flex;flex-direction:column;line-height:1.1}
.kv small{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.kv b{font:600 22px var(--sans)}
.kv b i{font:500 11px var(--sans);color:var(--muted);font-style:normal;margin-left:3px}
.kv.sub b{font-size:15px;color:var(--ink2)}
.kv .why{font-size:10.5px;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-size:11.5px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.perr{flex-basis:100%;color:var(--alert);font-size:11.5px;min-height:0}
.perr:empty{display:none}
.detail{border-top:1px solid var(--line2);background:var(--sunk)}
.detail .wrap{padding-block:8px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;font-size:12px}
.mini{border-collapse:collapse}
.mini td,.mini th{padding:3px 10px 3px 0;text-align:left}
.mini th{font-size:10.5px;color:var(--muted);font-weight:600}
.mini td.n{text-align:right}
.mini tr.on td{color:var(--accent);font-weight:600}
.minibar{display:none}

main.wrap{display:flex;flex-direction:column;gap:14px;padding-block:14px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.hd{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2)}
.hd h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.02em}
.hd .hint{font-size:11.5px;color:var(--muted)}
.search{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:0 9px}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* 왼쪽 목록 + 오른쪽 내용 (용량·가이드 공통) */
.dose,.guide{display:grid;grid-template-columns:260px minmax(0,1fr)}
.dl,.gl{border-right:1px solid var(--line2);padding:10px;display:flex;flex-direction:column;gap:8px}
.dlist,.glist{list-style:none;margin:0;padding:0;overflow:auto}
.dlist .grp,.glist .grp{font-size:12px;color:var(--ink);font-weight:700;padding:9px 6px 3px;margin-top:4px;border-top:1px solid var(--line2)}
.dlist .grp:first-child,.glist .grp:first-child{border-top:0;margin-top:0}
.dlist button,.glist button{width:100%;text-align:left;background:none;border:0;border-radius:5px;cursor:pointer}
.dlist button:hover,.glist button:hover{background:var(--sunk)}

/* dose */
.dlist{max-height:430px}
.dlist button{display:flex;justify-content:space-between;gap:6px;padding:4px 6px}
.dlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.dlist .b{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px}
.dr{padding:12px 16px;min-width:0}
.dname{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.dname h3{margin:0;font-size:17px}
.dname .meta{color:var(--muted);font-size:12px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 0}
.tabs button{border:1px solid var(--line);background:var(--sunk);border-radius:5px;padding:3px 9px;cursor:pointer;font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.rec{margin:10px 0;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:7px;padding:10px 12px}
.rec .lab{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
.rec .dz{font:600 16px/1.35 var(--sans);white-space:pre-line;margin-top:2px}
.rec .why{font-size:11.5px;color:var(--ink2);margin-top:4px}
.rec .wt{font-size:12px;margin-top:6px;padding-top:6px;border-top:1px dashed var(--accent-line)}
.rec.warn{border-color:var(--warn-line);background:var(--warn-soft)}
.rec.warn .lab{color:var(--warn)}
.rec.warn .alt{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-top:6px}
.rec.warn .alt span{font:600 12px var(--sans);color:var(--warn);white-space:nowrap}
.rec.warn .alt div{font:600 13.5px/1.35 var(--sans);white-space:pre-line}
.rec.none{background:var(--sunk);border-color:var(--line)}
.rec.none .lab{color:var(--muted)}
.bt{width:100%;border-collapse:collapse;font-size:12.5px}
.bt th,.bt td{padding:5px 8px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:top}
.bt th{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:var(--sunk)}
.bt td:first-child{white-space:nowrap;color:var(--ink2);width:1%}
.bt td.dz{white-space:pre-line}
.bt td.na{color:var(--muted)}
.bt tr.dial td:first-child{font-weight:600}
.bt tr.sep td{border-top:2px solid var(--line)}
.bt tr.hit td{background:var(--accent-soft)}
.bt tr.hit td:first-child{box-shadow:inset 3px 0 0 var(--accent);color:var(--accent);font-weight:700}
.bt tr.amb td{background:var(--warn-soft)}
.bt tr.amb td:first-child{box-shadow:inset 3px 0 0 var(--warn);color:var(--warn);font-weight:700}
.bt .ln{display:block}
.bt .ln.on{font-weight:700;color:var(--accent)}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}
.tblw{overflow-x:auto}

/* guides */
.glist{max-height:620px}
.glist button{padding:5px 6px;line-height:1.35}
.glist button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.glist button small{display:block;font-size:11px;opacity:.75}
.gm{min-width:0;display:flex;flex-direction:column}
.gh{padding:12px 20px 8px;border-bottom:1px solid var(--line2)}
.gh h3{margin:0;font-size:17px;text-wrap:balance}
.toc{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.toc a{font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink2);text-decoration:none;background:var(--sunk)}
.toc a:hover{border-color:var(--accent);color:var(--accent)}
.gb{padding:6px 20px 24px;max-height:640px;overflow:auto;font-size:13.5px}
.gb h2{font-size:14.5px;margin:18px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line);color:var(--accent);scroll-margin-top:8px}
.gb h3{font-size:13.5px;margin:12px 0 4px;scroll-margin-top:8px}
.gb p{margin:3px 0;max-width:80ch}
.gb ul,.gb ol{margin:3px 0;padding-left:20px}
.gb li{margin:1px 0}
.gb li p{margin:0}
.gb strong{font-weight:600}
.gb table{border-collapse:collapse;margin:8px 0;font-size:12.5px;min-width:50%}
.gb td{border:1px solid var(--line);padding:4px 7px;vertical-align:top}
.gb td p{margin:0}
.gb tr:first-child td{background:var(--th);font-weight:600}
.gb .muted{color:var(--grey-text)}
.gb .alert{color:var(--alert);font-weight:600}
.gb img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff;margin:6px 0}
.gb .tw{overflow-x:auto}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding-block:14px 28px}
footer p{margin:2px 0}

/* 좁은 화면 (핸드폰) — JS의 NARROW와 같은 값 */
@media (max-width:860px){
  .top{position:static}
  .renal{margin-left:0;flex-basis:100%;justify-content:flex-start;border-top:1px solid var(--line2);padding-top:6px}
  .brand{flex-basis:100%;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:8px}
  .box input{width:54px}
  .minibar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;gap:12px;align-items:baseline;padding:6px 16px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .minibar b{font-size:15px;color:var(--ink)}
  .minibar a{margin-left:auto;color:var(--accent);font-weight:600;text-decoration:none}
  .dose,.guide{grid-template-columns:1fr}
  .dl,.gl{border-right:0;border-bottom:1px solid var(--line2)}
  .dlist{max-height:220px}
  .glist{max-height:240px}
  .gb{max-height:none}
}
</style>

</head>
<body>


<header class="top" id="top">
  <form class="wrap" id="pf" novalidate>
    <div class="brand"><b>감염내과 참고서</b><span>항생제 용량 · 질환별 가이드</span></div>
    <div class="f"><span>성별</span><div class="seg">
      <input type="radio" name="sex" id="sx-m" value="m" checked><label for="sx-m">남</label>
      <input type="radio" name="sex" id="sx-f" value="f"><label for="sx-f">여</label></div></div>
    <label class="f"><span>나이</span><div class="box"><input id="age" type="number" inputmode="numeric" value="72"><em>세</em></div></label>
    <label class="f"><span>체중</span><div class="box"><input id="wt" type="number" inputmode="decimal" step="0.1" value="84"><em>kg</em></div></label>
    <label class="f"><span>키</span><div class="box"><input id="ht" type="number" inputmode="decimal" step="0.1" value="168"><em>cm</em></div></label>
    <label class="f"><span>SCr</span><div class="box"><input id="cr" type="number" inputmode="decimal" step="0.01" value="1.6"><em>mg/dL</em></div></label>
    <label class="f"><span>투석</span><div class="box"><select id="rrt"><option value="">없음</option><option value="HD">HD</option><option value="CAPD">CAPD</option><option value="CRRT">CRRT</option></select></div></label>
    <div class="renal">
      <div class="kv"><small>CrCl (C-G)</small><b id="vCrcl">–<i>mL/min</i></b><span class="why" id="vWhy"></span></div>
      <div class="kv sub"><small>eGFR (CKD-EPI 2021)</small><b id="vEgfr">–<i>mL/min/1.73m²</i></b><span class="why">&nbsp;</span></div>
      <button type="button" class="lnk" id="btnDetail" aria-expanded="false">체중 상세</button>
    </div>
    <div class="perr" id="perr" role="alert"></div>
  </form>
  <div class="detail" id="detail" hidden><div class="wrap">
    <table class="mini"><thead><tr><th>기준 체중</th><th>kg</th><th>CrCl</th></tr></thead><tbody id="wRows"></tbody></table>
    <div id="wMeta" style="color:var(--muted)"></div>
  </div></div>
</header>

<div class="minibar" id="minibar" aria-live="polite"></div>
<main class="wrap">

  <section class="card" id="dose" aria-labelledby="hDose">
    <div class="hd"><h2 id="hDose">권장 용량</h2><span class="hint">항생제를 고르면 위의 CrCl·eGFR·투석 정보로 용량 구간을 찾습니다.</span></div>
    <div class="dose">
      <div class="dl">
        <input class="search" id="dq" type="search" placeholder="항생제 검색 (성분명·상품명)" aria-label="항생제 검색">
        <ul class="dlist" id="dList"></ul>
      </div>
      <div class="dr" id="dOut" aria-live="polite"></div>
    </div>
  </section>

  <section class="card" id="guides" aria-labelledby="hGuide">
    <div class="hd"><h2 id="hGuide">질환별 가이드</h2></div>
    <div class="guide">
      <div class="gl">
        <input class="search" id="gq" type="search" placeholder="항목·본문 검색" aria-label="가이드 검색">
        <ul class="glist" id="gList"></ul>
      </div>
      <div class="gm"><div class="gh" id="gHead"></div><div class="gb" id="gBody"></div></div>
    </div>
  </section>
</main>

<footer><div class="wrap">
  <p>본 자료는 임상 판단을 보조하기 위한 것이며, 최종 처방 용량은 처방의의 판단과 책임에 따릅니다.</p>
  <p>오류나 수정이 필요한 내용이 있으면 인제대학교 일산백병원 감염내과 현종훈 선생님에게 연락해 주세요.</p>
  <p>최종 개정일: <span id="rev"></span></p>
  <p id="src"></p>
</div></footer>

<script>
function main(DATA){
for(const g of DATA.guides){ if(g.text==null){ const t=document.createElement('div'); t.innerHTML=g.html; g.text=t.textContent; } }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = x => (Math.round(x*10)/10).toFixed(1);
const narrow = () => matchMedia('(max-width:860px)').matches; // CSS의 좁은 화면 기준과 같은 값
$('rev').textContent = DATA.revised;
const M = DATA.meta;
if(M?.drugs_source) $('src').textContent = `원본: 용량표 ${M.drugs_source} (${M.drugs_uploaded} 업로드) · 가이드 ${M.guides_source} (${M.guides_uploaded} 업로드)`;

/* ---------- 환자 계산 ---------- */
let P = null;
function calc(){
  const sex = document.querySelector('input[name=sex]:checked').value;
  const age=+$('age').value, wt=+$('wt').value, ht=+$('ht').value, scr=+$('cr').value, rrt=$('rrt').value;
  const e=[];
  if(!(age>=18&&age<=120)) e.push('나이(18–120)');
  if(!(wt>0)) e.push('체중');
  if(!(ht>=100&&ht<=250)) e.push('키(100–250 cm)');
  if(!(scr>0)) e.push('SCr');
  $('perr').textContent = e.length ? '입력 확인: '+e.join(', ') : '';
  if(e.length) return null;
  const inch=ht/2.54, ibw=(sex==='m'?50:45.5)+2.3*(inch-60), adj=ibw+0.4*(wt-ibw), bmi=wt/(ht/100)**2;
  const cg = w => (140-age)*w/(72*scr)*(sex==='f'?0.85:1);
  let key, why;
  if(bmi<18.5){key='tbw';why='BMI '+f1(bmi)+' · 실제체중';}
  else if(bmi<25){ if(wt<ibw){key='tbw';why='BMI '+f1(bmi)+' · 실제체중(<IBW)';} else {key='ibw';why='BMI '+f1(bmi)+' · IBW';} }
  else {key='adj';why='BMI '+f1(bmi)+' · AdjBW';}
  const W={tbw:wt,ibw,adj};
  const k=sex==='f'?0.7:0.9, a=sex==='f'?-0.241:-0.302;
  const egfr=142*Math.min(scr/k,1)**a*Math.max(scr/k,1)**-1.2*0.9938**age*(sex==='f'?1.012:1);
  return {sex,age,wt,ht,scr,rrt,bmi,ibw,adj,W,key,why,crcl:cg(W[key]),egfr,
    rows:[['tbw','실제체중 (TBW)',wt],['ibw','이상체중 (IBW)',ibw],['adj','보정체중 (AdjBW)',adj]].map(([k,n,w])=>({k,n,w,c:cg(w)}))};
}
function renderP(){
  P=calc();
  if(!P){ $('minibar').innerHTML='<span>환자 정보를 입력하세요</span><a href="#top">입력</a>'; $('vCrcl').innerHTML='–<i>mL/min</i>'; $('vEgfr').innerHTML='–<i>mL/min/1.73m²</i>'; $('vWhy').textContent=''; $('wRows').innerHTML=''; $('wMeta').textContent=''; }
  else{
    $('vCrcl').innerHTML=Math.round(P.crcl)+'<i>mL/min</i>';
    $('vEgfr').innerHTML=Math.round(P.egfr)+'<i>mL/min/1.73m²</i>';
    $('vWhy').textContent=P.why;
    $('minibar').innerHTML=`<span>CrCl <b>${Math.round(P.crcl)}</b></span><span>eGFR <b>${Math.round(P.egfr)}</b></span><span>${P.rrt||'투석 없음'}</span><a href="#top">환자 정보 수정</a>`;
    $('wRows').innerHTML=P.rows.map(r=>`<tr class="${r.k===P.key?'on':''}"><td>${r.n}${r.k===P.key?' · CrCl 사용':''}</td><td class="n">${f1(r.w)}</td><td class="n">${f1(r.c)}</td></tr>`).join('');
    $('wMeta').innerHTML=`BMI ${f1(P.bmi)} kg/m² · TBW/IBW ${Math.round(P.wt/P.ibw*100)}%${P.wt>P.ibw*1.2?' (비만 기준 초과)':''}${P.ht<152.4?'<br>키 152.4 cm 미만: IBW 해석 주의':''}`;
  }
  renderDose();
}

/* ---------- 체중 기반 ---------- */
function doseWeight(d){
  if(!P) return null;
  const obese = P.wt > P.ibw*1.2;
  switch(d.weight){
    case 'IBW_AG': if(P.wt<P.ibw) return [P.wt,'TBW']; if(obese) return [P.adj,'AdjBW']; return [P.ibw,'IBW'];
    case 'TBW': return [P.wt,'TBW'];
    case 'TBW_OBESE_ADJ': return obese?[P.adj,'AdjBW']:[P.wt,'TBW'];
    case 'MIN_IBW_TBW': return P.ibw<P.wt?[P.ibw,'IBW']:[P.wt,'TBW'];
  }
  return null;
}
function mgkgLines(text, d){
  const w=doseWeight(d); if(!w||!text) return '';
  const out=[]; const re=/(\d+(?:\.\d+)?)(?:\s*-\s*(\d+(?:\.\d+)?))?\s*mg\/kg/g; let m;
  const seen=new Set();
  while((m=re.exec(text))){
    const key=m[0]; if(seen.has(key)) continue; seen.add(key);
    const lo=+m[1], hi=m[2]?+m[2]:null;
    const after=text.slice(m.index+m[0].length, m.index+m[0].length+18);
    const cap=(after.match(/max\s*(\d+(?:\.\d+)?)\s*g/i)||[])[1];
    const capmg=cap?+cap*1000:null;
    const v=x=>{const r=Math.round(x*w[0]); return capmg&&r>capmg?`${capmg.toLocaleString()}(최대)`:r.toLocaleString();};
    out.push(`<div><b>${esc(key)}</b> × ${f1(w[0])} kg (${w[1]}) = <b>${v(lo)}${hi?'–'+v(hi):''} mg</b></div>`);
  }
  return out.length?`<div class="wt">${out.join('')}</div>`:'';
}

/* ---------- 구간 판정 ---------- */
const inB=(b,v)=>(b.lo==null||v>=b.lo)&&(b.hi==null||v<=b.hi);
function judge(reg){
  if(!P) return {type:'nopt'};
  if(P.rrt){ const x=reg.dialysis[P.rrt]; return {type:'dial',key:P.rrt,dose:x?x.dose:null}; }
  const val = reg.basis==='eGFR'?P.egfr:P.crcl;
  return judgeV(reg, Math.round(val));
}
function judgeV(reg, v){
  const hits=reg.bands.filter(b=>inB(b,v));
  if(hits.length===1) return {type:'one',v,hits};
  if(hits.length>1){ if(new Set(hits.map(b=>b.dose)).size===1) return {type:'one',v,hits:[{...hits[0],text:hits.map(b=>b.text).join(' / ')}],all:hits}; return {type:'overlap',v,hits}; }
  const below=reg.bands.filter(b=>b.hi!=null&&b.hi<v).sort((a,b)=>b.hi-a.hi)[0];
  const above=reg.bands.filter(b=>b.lo!=null&&b.lo>v).sort((a,b)=>a.lo-b.lo)[0];
  if(below&&above) return {type:'gap',v,hits:[above,below]};
  return {type:'outside',v,hits:[below||above].filter(Boolean)};
}
function subLines(text, v){
  // colistin 등 셀 안 "CrCl a-b: ..." 줄 강조
  if(!text||v==null||!/CrCl\s*[\d<>≥≤]/.test(text.split('\n').slice(1).join('\n'))) return null;
  return text.split('\n').map(l=>{
    const m=l.match(/CrCl\s*(≥|>=|>|<|≤)?\s*(\d+)(?:\s*-\s*(\d+))?/); let on=false;
    if(m){ const a=+m[2], b=m[3]?+m[3]:null, op=m[1];
      if(b!=null) on=v>=a&&v<=b; else if(op==='≥'||op==='>=') on=v>=a; else if(op==='>') on=v>a; else if(op==='<') on=v<a; else if(op==='≤') on=v<=a; }
    return `<span class="ln${on?' on':''}">${esc(l)||'&nbsp;'}</span>`;
  }).join('');
}

/* ---------- 권장 용량 ---------- */
const DRUGS=DATA.drugs.filter(d=>d.status==='active');
let sel=DRUGS.find(d=>d.id==='piperacillin-tazobactam')?.id||DRUGS[0].id, regIx=0;
function renderList(){
  const q=$('dq').value.trim().toLowerCase(); let html='', cls=null;
  const list=DRUGS.filter(d=>!q||(d.name+' '+(d.brand||'')).toLowerCase().includes(q));
  for(const d of list){
    if(d.class!==cls){ cls=d.class; html+=`<li class="grp">${esc(cls)}</li>`; }
    html+=`<li><button type="button" data-id="${d.id}" aria-current="${d.id===sel}"><span>${esc(d.name)}</span><span class="b">${esc((d.brand||'').split('\n')[0])}</span></button></li>`;
  }
  $('dList').innerHTML=html||'<li class="grp">검색 결과 없음</li>';
}
function renderDose(){
  const d=DRUGS.find(x=>x.id===sel); if(!d){$('dOut').innerHTML='';return;}
  if(regIx>=d.regimens.length) regIx=0;
  const reg=d.regimens[regIx], J=judge(reg);
  const basisTxt=reg.basis==='eGFR'?'eGFR 기준':'CrCl 기준';
  let card='';
  const hitSet=new Set((J.all||J.hits||[]).map(b=>b.text));
  const doseTxt=t=>t==null?'자료 없음':t;
  if(J.type==='nopt') card=`<div class="rec none"><div class="lab">권장 용량</div><div class="why">상단 환자 정보를 입력하세요.</div></div>`;
  else if(J.type==='dial') card=`<div class="rec ${J.dose?'':'none'}"><div class="lab">권장 용량 · ${J.key}</div><div class="dz">${esc(doseTxt(J.dose))}</div>${mgkgLines(J.dose,d)}</div>`;
  else if(J.type==='one'){ const b=J.hits[0]; const sub=subLines(b.dose,J.v);
    card=`<div class="rec ${b.dose?'':'none'}"><div class="lab">권장 용량 · ${basisTxt}</div><div class="dz">${sub||esc(doseTxt(b.dose))}</div><div class="why">${reg.basis} ${J.v} → ${esc(b.text)}</div>${mgkgLines(b.dose,d)}</div>`; }
  else { const title = J.type==='overlap' ? `원문 구간 경계값 · ${reg.basis} ${J.v}은 두 구간에 모두 해당합니다. 임상 상황에 맞게 선택하세요.`
         : J.type==='gap' ? `원문 구간 사이 값 · ${reg.basis} ${J.v}은 원문 구간 사이에 있습니다. 양쪽 용량을 참고하세요.`
         : `원문에 ${reg.basis} ${J.v}에 해당하는 구간이 없습니다. 가장 가까운 구간을 참고하세요.`;
    card=`<div class="rec warn"><div class="lab">⚠ 확인 필요 · ${basisTxt}</div><div class="why">${title}</div><div class="alt">${J.hits.map(b=>`<span>${esc(b.text)}</span><div>${subLines(b.dose,J.v)||esc(doseTxt(b.dose))}</div>`).join('')}</div>${[...new Set(J.hits.map(b=>mgkgLines(b.dose,d)))].join('')}</div>`; }
  const cls = b => !hitSet.has(b.text)?'':(J.type==='one'?'hit':'amb');
  const rows=reg.bands.map(b=>`<tr class="${cls(b)}"><td>${esc(b.text)}</td><td class="${b.dose?'dz':'na'}">${b.dose?esc(b.dose):'자료 없음'}</td></tr>`).join('')
    + ['HD','CAPD','CRRT'].map((k,i)=>{const x=reg.dialysis[k]; return `<tr class="dial${i===0?' sep':''} ${J.type==='dial'&&J.key===k?'hit':''}"><td>${k}</td><td class="${x.dose?'dz':'na'}">${x.dose?esc(x.dose):'자료 없음'}</td></tr>`;}).join('');
  const wnote=d.weight_label?`<p class="note">mg/kg 계산 체중: ${esc(d.weight_label)}</p>`:'';
  $('dOut').innerHTML=`<div class="dname"><h3>${esc(d.name)}</h3><span class="meta">${esc((d.brand||'').replace(/\n/g,' · '))} · ${esc(d.class)}</span></div>
    ${d.regimens.length>1?`<div class="tabs" role="group" aria-label="용법">${d.regimens.map((r,i)=>`<button type="button" data-r="${i}" aria-pressed="${i===regIx}">${esc(r.label)}</button>`).join('')}</div>`:''}
    ${card}
    <div class="tblw"><table class="bt"><thead><tr><th>${reg.basis} (mL/min${reg.basis==='eGFR'?'/1.73m²':''})</th><th>용량</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${wnote}${d.note?`<p class="note">${esc(d.note)}</p>`:''}`;
}
$('dq').addEventListener('input',renderList);
$('dList').addEventListener('click',e=>{const b=e.target.closest('button[data-id]'); if(!b) return; sel=b.dataset.id; regIx=0; renderList(); renderDose();});
$('dOut').addEventListener('click',e=>{const b=e.target.closest('button[data-r]'); if(!b) return; regIx=+b.dataset.r; renderDose();});

/* ---------- 가이드 ---------- */
const G=DATA.guides; let gSel=G[0].id;
function renderGList(){
  const q=$('gq').value.trim().toLowerCase(); let html='', grp=null;
  for(const s of G){
    if(q && !(s.title+' '+s.text).toLowerCase().includes(q)) continue;
    if(s.group!==grp){grp=s.group; html+=`<li class="grp">${esc(grp)}</li>`;}
    const m=s.title.match(/^(.*?)\s*(\(.*\))?$/);
    html+=`<li><button type="button" data-g="${s.id}" aria-current="${s.id===gSel}">${esc(m[1])}${m[2]?`<small>${esc(m[2].slice(1,-1))}</small>`:''}</button></li>`;
  }
  $('gList').innerHTML=html||'<li class="grp">검색 결과 없음</li>';
}
function renderG(){
  const s=G.find(x=>x.id===gSel), h2=s.subsections.filter(x=>x.level===2);
  $('gHead').innerHTML=`<h3>${esc(s.title)}</h3>${h2.length?`<nav class="toc" aria-label="소제목">${h2.map(x=>`<a href="#${x.anchor}" data-a="${x.anchor}">${esc(x.title.replace(/\s*\(.*$/,''))}</a>`).join('')}</nav>`:''}`;
  $('gBody').innerHTML=s.html.replace(/<table>/g,'<div class="tw"><table>').replace(/<\/table>/g,'</table></div>');
  $('gBody').scrollTop=0;
}
$('gq').addEventListener('input',renderGList);
$('gList').addEventListener('click',e=>{const b=e.target.closest('button[data-g]'); if(!b) return; gSel=b.dataset.g; renderGList(); renderG(); if(narrow()) $('gHead').scrollIntoView({behavior:'smooth'});});
$('gHead').addEventListener('click',e=>{const a=e.target.closest('a[data-a]'); if(!a) return; e.preventDefault(); const t=document.getElementById(a.dataset.a); if(!t) return;
  if(narrow()) t.scrollIntoView({behavior:'smooth'}); else $('gBody').scrollTo({top:t.offsetTop-$('gBody').offsetTop-4,behavior:'smooth'});});

/* ---------- 공통 ---------- */
$('pf').addEventListener('input',renderP);
$('pf').addEventListener('submit',e=>e.preventDefault());
$('btnDetail').addEventListener('click',()=>{const d=$('detail'); d.hidden=!d.hidden; $('btnDetail').setAttribute('aria-expanded',String(!d.hidden)); pad();});
function pad(){document.documentElement.style.scrollPaddingTop=((narrow()?$('minibar').offsetHeight:$('top').offsetHeight)+10)+'px';}
addEventListener('resize',pad);
renderList(); renderGList(); renderG(); renderP(); pad();
window.__app={ // tests/app.test.mjs에서 사용
calc,judge,judgeV,renderP,get P(){return P},DRUGS,doseWeight,mgkgLines};
}
const EMBED=/*__DATA__*/null; // tests/app.test.mjs가 test 데이터를 넣는 자리
if(EMBED) main(EMBED);
else Promise.all(['data/drugs.json','data/guides.json','data/meta.json'].map(u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok) throw r.status; return r.json();})))
  .then(([d,g,m])=>main({revised:m.revised,meta:m,drugs:d.drugs,guides:g.sections}))
  .catch(()=>{document.getElementById('dOut').textContent='데이터를 불러오지 못했습니다. 새로고침해 주세요.';});
</script>
