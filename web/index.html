<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="CrCl·eGFR 기반 항생제 권장 용량과 질환별 가이드">
<title>감염내과 참고서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script data-goatcounter="https://ayu870213.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>


<header class="top" id="top">
  <form class="wrap" id="pf" novalidate>
    <div class="brand"><b>감염내과 참고서</b><span>항생제 용량 · 질환별 가이드</span></div>
    <div class="f"><span>성별</span><div class="seg">
      <input type="radio" name="sex" id="sx-m" value="m"><label for="sx-m">남</label>
      <input type="radio" name="sex" id="sx-f" value="f"><label for="sx-f">여</label></div></div>
    <label class="f"><span>나이</span><div class="box"><input id="age" type="number" inputmode="numeric"><em>세</em></div></label>
    <label class="f"><span>체중</span><div class="box"><input id="wt" type="number" inputmode="decimal" step="0.1"><em>kg</em></div></label>
    <label class="f"><span>키</span><div class="box"><input id="ht" type="number" inputmode="decimal" step="0.1"><em>cm</em></div></label>
    <label class="f"><span>SCr</span><div class="box"><input id="cr" type="number" inputmode="decimal" step="0.01"><em>mg/dL</em></div></label>
    <label class="f"><span>투석</span><div class="box"><select id="rrt"><option value="">없음</option><option value="HD">HD</option><option value="CAPD">CAPD</option><option value="CRRT">CRRT</option></select></div></label>
    <div class="renal">
      <div class="kv"><small>CrCl (C-G)</small><b id="vCrcl">–<i>mL/min</i></b><span class="why" id="vWhy"></span></div>
      <div class="kv sub"><small>eGFR (CKD-EPI 2021)</small><b id="vEgfr">–<i>mL/min/1.73m²</i></b><span class="why">&nbsp;</span></div>
      <button type="button" class="lnk" id="btnDetail" aria-expanded="false">체중 상세</button>
    </div>
    <div class="perr" id="perr" role="alert"></div>
  </form>
  <div class="detail" id="detail" hidden><div class="wrap">
    <table class="mini"><thead><tr><th>기준 체중</th><th>kg</th><th>CrCl</th></tr></thead><tbody id="wRows"></tbody></table>
    <div id="wMeta" style="color:var(--muted)"></div>
  </div></div>
</header>

<div class="minibar" id="minibar" aria-live="polite"></div>
<main class="wrap">

  <section class="card" id="dose" aria-labelledby="hDose">
    <div class="hd"><h2 id="hDose">권장 용량</h2><span class="hint">항생제를 고르면 위의 CrCl·eGFR·투석 정보로 용량 구간을 찾습니다.</span></div>
    <div class="dose">
      <div class="dl">
        <input class="search" id="dq" type="search" placeholder="항생제 검색 (성분명·상품명)" aria-label="항생제 검색">
        <ul class="dlist" id="dList"></ul>
      </div>
      <div class="dr" id="dOut" aria-live="polite"></div>
    </div>
  </section>

  <section class="card" id="guides" aria-labelledby="hGuide">
    <div class="hd"><h2 id="hGuide">질환별 가이드</h2></div>
    <div class="guide">
      <div class="gl">
        <input class="search" id="gq" type="search" placeholder="항목·본문 검색" aria-label="가이드 검색">
        <ul class="glist" id="gList"></ul>
      </div>
      <div class="gm"><div class="gh" id="gHead"></div><div class="gb" id="gBody"></div></div>
    </div>
  </section>
</main>

<footer><div class="wrap">
  <p>본 자료는 임상 판단을 보조하기 위한 것이며, 최종 처방 용량은 처방의의 판단과 책임에 따릅니다.</p>
  <p>오류나 수정이 필요한 내용이 있으면 인제대학교 일산백병원 감염내과 현종훈 선생님에게 연락해 주세요.</p>
  <p>최종 개정일: <span id="rev"></span></p>
  <p id="src"></p>
</div></footer>

<script src="renal.js"></script>
<script src="app.js"></script>

</body>
</html>
